; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Standalone voice-controlled home automation system (ESP32-S3).
; No Wi-Fi, cloud services, or external libraries are used at this stage.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
framework = arduino

; ---------------------------------------------------------------------------
; BOARD CONFIGURATION — PLACEHOLDER
; The exact ESP32-S3 board model has NOT been confirmed yet.
; "esp32-s3-devkitc-1" is PlatformIO's generic ESP32-S3 target and is used
; here only so the project compiles. Replace it (and flash/PSRAM settings,
; if needed) once the real board is known.
; ---------------------------------------------------------------------------
board = esp32-s3-devkitc-1

monitor_speed = 115200

; Modules in lib/ include each other by header name (e.g. system -> relay),
; so let the Library Dependency Finder follow nested includes.
lib_ldf_mode = chain+

; -I include: lets modules in lib/ reach the shared include/pins.h.
build_flags =
    -I include
    -Wall
    -Wextra
